<app-modal
  [title]="title()"
  [modalId]="modalId()"
  [isLoading]="isLoading()"
  [heroImage]="heroImage"
  (handleClose)="handleClose.emit()"
>
  @if (introduction(); as speciesIntroduction) {
    @for (paragraph of speciesIntroduction.content.paragraphs; track paragraph) {
      <p>{{ paragraph }}</p>
    }

    @for (source of speciesIntroduction.content.sources; track source.url) {
      <source-link [url]="source.url" [label]="source.name" />
    }
  }
</app-modal>
