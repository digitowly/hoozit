<div class="login">
  <section class="login-intro-section">
    <app-icon name="user" size="size-large" data-test-id="login-icon" />
    <h2 i18n="@@loginIntroTitle" data-test-id="login-title">
      Hello, explorer!
    </h2>
    <p i18n="@@loginIntroDescription" data-test-id="login-description">
      Every sighting has a story. Sign in to keep track of your wildlife
      discoveries.
    </p>
  </section>

  <login-button provider="google" data-test-id="social-login-google" />
  <login-button provider="apple" data-test-id="social-login-apple" />

  <hr />

  <form-container>
    <p>Email and Password</p>
    <input
      type="email"
      placeholder="Email"
      [formField]="loginForm.email"
      data-test-id="email-input"
    />
    <input
      type="password"
      placeholder="Password"
      [formField]="loginForm.password"
      data-test-id="password-input"
    />

    <login-button
      provider="email"
      data-test-id="email-login-button"
      (click)="loginWithEmailAndPassword()"
    />

    @if (errorMessage()) {
      <p class="error-message" data-test-id="error-message">
        {{ errorMessage() }}
      </p>
    }
  </form-container>

  <p class="privacy-note" data-test-id="login-privacy-note">
    <span i18n="@@loginPrivacyNote">Curious what we store?</span>
    <a routerLink="/privacy" data-test-id="login-privacy-link" i18n="@@loginPrivacyLink">Read our privacy notes</a>
  </p>
</div>
