<search-result-selection-dock
  [selections]="selections()"
  (selectionOpened)="select($event)"
  (selectionRemoved)="removeSelection($event)"
/>
@if (isVisible()) {
  <species-overview-modal
    [modalId]="modalId"
    [isLoading]="isIntroductionLoading()"
    [title]="selected()?.name || ''"
    [introduction]="introduction()"
    (handleClose)="closeModal()"
  />
}
