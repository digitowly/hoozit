@if (phase() === "zoomedOut") {
  @if (!zooming()) {
    <p class="scout-lens-caption" i18n>Zoom in to scout</p>
  }
} @else {
  @if (!zooming()) {
    <div
      class="scout-lens"
      [class.scout-lens--loading]="activeLens().loading"
      [class.scout-lens--failed]="showFailure()"
      [style.left.px]="activeLens().x"
      [style.top.px]="activeLens().y"
      [style.width.px]="activeLens().radius * 2"
      [style.height.px]="activeLens().radius * 2"
    >
      @if (activeLens().loading) {
        <div class="scout-lens__ping"></div>
      }
      <div class="scout-lens__dot"></div>
    </div>
    @if (ghostLens(); as ghost) {
      <div
        class="scout-lens scout-lens--ghost"
        [class.scout-lens--loading]="ghost.loading"
        [style.left.px]="ghost.x"
        [style.top.px]="ghost.y"
        [style.width.px]="ghost.radius * 2"
        [style.height.px]="ghost.radius * 2"
      >
        @if (ghost.loading) {
          <div class="scout-lens__ping"></div>
        }
        <div class="scout-lens__dot"></div>
      </div>
    }
    @if (showFailure()) {
      <button
        class="scout-lens-badge"
        [class.scout-lens-badge--gliding]="gliding()"
        [style.left.px]="activeLens().x"
        [style.top.px]="activeLens().y + 52"
        (click)="retry.emit()"
      >
        <app-icon name="reload" size="size-small" />
        <span i18n>Sightings unavailable — tap to retry</span>
      </button>
    }
  }
  <app-button-container class="scout-controls">
    <button
      class="scout-control"
      [disabled]="!canDecreaseRadius()"
      i18n-aria-label
      aria-label="Decrease lens size"
      i18n-title
      title="Decrease lens size"
      (click)="decreaseRadius.emit()"
    >
      <app-icon name="minus-circle" size="size-small" />
    </button>
    <button
      class="scout-control search-button"
      [class.is-visible]="showSearchControl()"
      [disabled]="!showSearchControl()"
      [attr.tabindex]="showSearchControl() ? null : -1"
      [attr.aria-hidden]="showSearchControl() ? null : true"
      i18n-aria-label
      aria-label="Scout here"
      i18n-title
      title="Scout here"
      (click)="searchHere.emit()"
    >
      <app-icon name="binoculars" size="size-small" />
      <span i18n>Scout</span>
    </button>
    <button
      class="scout-control"
      [disabled]="!canIncreaseRadius()"
      i18n-aria-label
      aria-label="Increase lens size"
      i18n-title
      title="Increase lens size"
      (click)="increaseRadius.emit()"
    >
      <app-icon name="plus-circle" size="size-small" />
    </button>
  </app-button-container>
}
@if (!zooming()) {
  @if (userIndicator(); as user) {
    <div
      class="scout-user-indicator"
      [style.left.px]="user.x"
      [style.top.px]="user.y"
    ></div>
  }
}
